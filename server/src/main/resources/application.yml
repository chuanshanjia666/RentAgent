server:
  port: 8080

spring:
  application:
    name: rentagent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/rentagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:rentagent}
    password: ${MYSQL_PASSWORD:rentagent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rentagent: info

rentagent:
  # 生产环境务必通过环境变量覆盖 JWT 密钥（>= 64 字符）
  jwt-secret: ${JWT_SECRET:rentagent-dev-secret-key-please-change-in-production-0123456789abcdef}
  jwt-expire-hours: 72
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 演示期验证码固定值（dev 模式下任意手机号都用它），生产接入短信服务商后置空
  captcha-dev-code: "246810"
  # 身份证号加密密钥（Base64 的 16/24/32 字节），生产由环境变量注入
  aes-key: ${AES_KEY:cmVudGFnZW50LWRldi1rZXktMzItYnl0ZXMtYWJjZCE=}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

ai:
  # ── LLM 网关：三协议后端适配（与主流平台接口对应）─────────────────
  #   anthropic-messages       Anthropic Messages 原生协议（默认快捷通道：智谱 GLM 兼容端点）
  #   openai-chat-completions  OpenAI Chat Completions（GLM/DeepSeek/通义 等兼容此协议）
  #   openai-responses         OpenAI Responses API 新接口（内置适配器）
  # 生效顺序：AI_BACKEND 指定的命名后端 → backends 中第一个有 Key 的 → 快捷单后端 → 都没有则降级规则引擎
  active: ${AI_BACKEND:}
  protocol: ${AI_PROTOCOL:anthropic-messages}
  base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/anthropic}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:glm-5.3-flash}
  temperature: 0.7
  max-tokens: 2048
  timeout-seconds: 60
  # 命名多后端：配好 Key 后用 AI_BACKEND=<name> 一键切换；
  # 智谱 GLM 不单独设命名后端——快捷单后端（AI_API_KEY + 默认 base-url/model）即 GLM 通道
  backends:
    deepseek-chat:            # DeepSeek（走 Chat Completions 兼容协议）
      protocol: openai-chat-completions
      base-url: https://api.deepseek.com/v1
      api-key: ${AI_DEEPSEEK_KEY:}
      model: deepseek-chat
    claude-messages:          # Claude（Anthropic Messages 原生协议）
      protocol: anthropic-messages
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    openai-responses:         # OpenAI 新接口（Responses API）
      protocol: openai-responses
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
