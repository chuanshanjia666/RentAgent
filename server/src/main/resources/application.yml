server:
  port: 8080

spring:
  application:
    name: rentagent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/rentagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:rentagent}
    password: ${MYSQL_PASSWORD:rentagent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rentagent: info

rentagent:
  # 生产环境务必通过环境变量覆盖 JWT 密钥（>= 64 字符）
  jwt-secret: ${JWT_SECRET:rentagent-dev-secret-key-please-change-in-production-0123456789abcdef}
  jwt-expire-hours: 72
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 演示期验证码固定值（dev 模式下任意手机号都用它），生产接入短信服务商后置空
  captcha-dev-code: "246810"
  # 身份证号加密密钥（Base64 的 16/24/32 字节），生产由环境变量注入
  aes-key: ${AES_KEY:cmVudGFnZW50LWRldi1rZXktMzItYnl0ZXMtYWJjZCE=}
  # 允许的跨域来源（开发期为本机前端：Vite 开发服务器 5173 / 预览服务器 4173）。
  # 环回地址的 localhost 与 127.0.0.1 在浏览器里是两个来源，POST 会带 Origin 头，
  # 只写 localhost 时用 127.0.0.1 打开前端会被 CORS 拒绝，故两者都列出。
  # 桌面端（Electron）以 file:// 加载，不发 Origin 头，无需在此放行。
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}

ai:
  # ── LLM 网关：协议适配层，系统不绑定任何模型厂商 ─────────────────────
  # 只要端点兼容下列任一协议即可接入，模型由配置指定（换模型＝改配置，不改代码）：
  #   openai-chat-completions  OpenAI Chat Completions（最通用：自建/厂商/聚合网关多兼容此协议）
  #   anthropic-messages       Anthropic Messages 原生协议
  #   openai-responses         OpenAI Responses API 新接口（内置适配器）
  # 生效顺序：AI_BACKEND 指定的命名后端 → backends 中第一个有 Key 的 → 快捷单后端 → 都没有则降级规则引擎
  active: ${AI_BACKEND:}
  protocol: ${AI_PROTOCOL:openai-chat-completions}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4.1-mini}
  temperature: 0.7
  max-tokens: 2048
  timeout-seconds: 60
  # 命名多后端：配好 Key 后用 AI_BACKEND=<name> 一键切换（一个名字＝一套"协议+端点+模型"组合）：
  #   AI_BACKEND=commandcode-chat AGGREGATOR_API_KEY=<key> mvn spring-boot:run
  backends:
    commandcode-chat: # 聚合网关通道：同一端点下可指定任意模型（模型名形如 <厂商>/<模型>）
      protocol: openai-chat-completions
      base-url: ${AGGREGATOR_BASE_URL:https://api.commandcode.ai/provider/v1}
      api-key: ${AGGREGATOR_API_KEY:}
      model: ${AGGREGATOR_MODEL:deepseek/deepseek-v4.1-flash}
      # 该网关的边缘按 UA 放行，默认客户端 UA（okhttp/java）会被限流或截断流式响应，故显式覆盖
      user-agent: ${AGGREGATOR_USER_AGENT:curl/8.5.0}
    claude-messages: # Claude 官方端点（Anthropic Messages 原生协议）
      protocol: anthropic-messages
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
