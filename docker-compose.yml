services:
  mysql:
    image: mysql:8.0
    container_name: rentagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: rentagent
      MYSQL_USER: rentagent
      MYSQL_PASSWORD: rentagent123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack-server:latest
    container_name: rentagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    container_name: rentagent-server
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: rentagent
      MYSQL_PASSWORD: rentagent123
      REDIS_HOST: redis
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  uploads:
