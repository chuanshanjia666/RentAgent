services:
  mysql:
    image: mysql:8.0
    container_name: rentagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: rentagent
      MYSQL_USER: rentagent
      MYSQL_PASSWORD: rentagent123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack-server:latest
    container_name: rentagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    container_name: rentagent-server
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: rentagent
      MYSQL_PASSWORD: rentagent123
      REDIS_HOST: redis
      UPLOAD_DIR: /app/uploads
      # AI 通道：系统不绑定厂商，按后端名切换（与 application.yml 的 backends 一致）。
      # Key 为空即 AI 能力报 4001，属预期行为（不打任何规则兜底）。
      AI_BACKEND: ${AI_BACKEND:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AGGREGATOR_BASE_URL: ${AGGREGATOR_BASE_URL:-https://api.commandcode.ai/provider/v1}
      AGGREGATOR_MODEL: ${AGGREGATOR_MODEL:-inclusionai/ling-3.1-flash:free}
      AGGREGATOR_API_KEY: ${AGGREGATOR_API_KEY:-}
      # JWT_SECRET / AES_KEY 故意不在此透传：写成 ${JWT_SECRET:-} 会在未设置时注入空串，
      # 反而比仓库默认值更早炸（密钥长度不足直接启动失败）。对外部署时用
      #   JWT_SECRET=... AES_KEY=... docker compose up -d server
      # 或在此处补 env_file 指向本地 .env（默认值启动时会在日志里输出自检告警）。
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  uploads:
